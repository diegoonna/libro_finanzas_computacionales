# Red de seguridad de publicación.
#
# El sitio se publica desde docs/ (GitHub Pages, rama main). El flujo normal es
# renderizar localmente con `quarto render` y commitear docs/. Este workflow
# cubre el caso en que se pushea un capítulo editado SIN re-renderizar: el CI
# renderiza y, si docs/ quedó desactualizado, commitea la diferencia él mismo.
# Si docs/ ya estaba al día, no hace nada.
#
# Notas:
# - Gracias a `freeze: auto` con _freeze/ commiteado, el CI solo ejecuta Python
#   en los capítulos cuya fuente cambió sin re-render local; el resto usa los
#   resultados congelados.
# - El commit del bot usa GITHUB_TOKEN, que por diseño de GitHub no dispara
#   otra corrida de este workflow (no hay loop).

name: Render del libro (red de seguridad)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: render-libro
  cancel-in-progress: true

jobs:
  render:
    runs-on: ubuntu-latest
    # Un render normal tarda minutos. Sin este tope, un render colgado (pasó en
    # oct-2026: 6 h hasta que GitHub lo canceló) bloquea todo hasta el límite.
    timeout-minutes: 45
    env:
      # Chrome viene preinstalado en ubuntu-latest; Quarto lo usa para convertir
      # los diagramas mermaid a imagen en el PDF.
      QUARTO_CHROMIUM: /usr/bin/google-chrome
    steps:
      - name: Checkout con historial completo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # `date: last-modified` usa la fecha de modificación del archivo; sin este
      # paso, el checkout pone la fecha de hoy en todos los archivos y cada
      # página del libro cambiaría de fecha en cada corrida.
      - name: Restaurar fechas de modificación desde git
        uses: chetan/git-restore-mtime-action@v2

      - name: Instalar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"   # la de las versiones fijadas en requirements.txt
          cache: pip

      - name: Instalar dependencias de Python
        run: pip install -r requirements.txt

      - name: Instalar Quarto (con TinyTeX para el PDF)
        uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: 1.8.26
          tinytex: true

      # lang: es necesita el babel en español, que TinyTeX no trae de base
      - name: Instalar el soporte de español para LaTeX
        run: |
          TLMGR="$(command -v tlmgr || find "$HOME/.TinyTeX/bin" -name tlmgr | head -1)"
          "$TLMGR" update --self   # el TinyTeX recién instalado puede traer un tlmgr viejo
          "$TLMGR" install babel-spanish hyphen-spanish

      # Render completo (web + PDF). Si falla (casi siempre por el PDF), el paso
      # siguiente publica al menos la web, para que un PDF roto no frene el sitio.
      - name: Renderizar el libro (web + PDF)
        id: completo
        continue-on-error: true
        timeout-minutes: 30
        run: quarto render

      - name: Si el PDF falló, renderizar solo la web
        if: steps.completo.outcome == 'failure'
        timeout-minutes: 20
        run: |
          echo "::warning::El render completo falló; se publica solo la web (sin PDF actualizado)."
          quarto render --to html

      - name: Commitear docs/ si quedó desactualizado
        run: |
          git add docs _freeze
          if git diff --cached --quiet; then
            echo "docs/ ya estaba al día — nada para publicar."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "chore: re-render automático de docs/ [CI]"
            git push
          fi

  # Chequeo de links rotos en las fuentes del libro. No bloquea la publicación:
  # si un link externo murió, avisa (job en rojo) pero el render corre igual.
  links:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Chequear links con lychee
        uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --no-progress
            --accept 200..=299,429
            --max-retries 2
            --exclude 'bloomberg\.com'
            --exclude 'linkedin\.com'
            --exclude 'scholar\.google\.com'
            "**/*.qmd" "README.md"
          fail: true
